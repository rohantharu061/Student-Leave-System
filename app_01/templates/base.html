{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Dashboard</title>
</head>

<body>


    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Leave_system</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="nav nav-underline me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/dashboard/' %} active {% endif %}"
                            aria-current="page" href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/form/' %} active {% endif %}" aria-current="page"
                            href="{% url 'form' %}">Form</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/contact/' %} active {% endif %}" aria-current="page"
                            href="{% url 'contact' %}">Contact</a>
                    </li>

                </ul>
                <form method="GET" action="{% url 'dashboard' %}" class=" d-flex" role="search">
                    <select name="category" class="form-select me-3">
                        <option value="roll_number">roll_number</option>
                        <option value="full_name">full_name</option>
                        <option value="faculty">faculty</option>
                        <option value="semester">semester</option>
                        <option value="reason">reason</option>
                        <option value="student_mail">student_mail</option>
                    </select>
                    <input class="form-control me-2" name="searched" type="search" placeholder="Search here"
                        aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                    <button class="btn btn-underline me-auto mb-2 mb-lg-0"><a href="{% url 'dashboard' %} "
                            class="btn btn-outline-success">Back</a></button>

                </form>
            </div>
        </div>
    </nav>
    <!-- navbar-->
    {% block content%}
    {% endblock content %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
